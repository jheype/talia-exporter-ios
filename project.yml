name: TaliaExporter

options:
  bundleIdPrefix: com.talia
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.1.0

targets:
  TaliaExporter:
    type: application
    platform: iOS
    sources:
      - path: TaliaExporter
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TaliaExporter/Resources/TaliaExporter.entitlements
        DEVELOPMENT_TEAM: S3SCDDP668
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.talia.exporter
        PRODUCT_NAME: Talia Exporter
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: TaliaExporter/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - target: TaliaExporterWidget
        embed: true

  TaliaExporterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TaliaExporterWidget
      - path: TaliaExporter/Domain/WidgetSupport.swift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TaliaExporterWidget/TaliaExporterWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.talia.exporter.widgets
        PRODUCT_NAME: TaliaExporterWidget
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: TaliaExporterWidget/Info.plist
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
        APPLICATION_EXTENSION_API_ONLY: true

schemes:
  TaliaExporter:
    build:
      targets:
        TaliaExporter: all
        TaliaExporterWidget: all
    run:
      config: Debug
    archive:
      config: Release
